[workspace]
resolver = "2"
members = ["crates/flashdb", "crates/flashdb-sim", "crates/flashdb-bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.size]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
