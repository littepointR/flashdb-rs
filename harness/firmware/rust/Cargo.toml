[package]
name = "flashdb-firmware"
description = "Bare-metal Cortex-M3 measurement firmware: Rust flashdb crate on a RAM flash simulator"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Stand-alone workspace: this crate is measurement firmware, not a library
# member of the repo workspace.  It builds for thumbv7m-none-eabi and needs a
# custom linker script, so it must not inherit the workspace profiles.
[workspace]

[[bin]]
name = "fw-rust"
path = "main.rs"

[features]
# Real-hardware build: output goes to a RAM result buffer read back by the
# debug probe (semihosting is not guaranteed on every probe), and DWT cycle
# counters are reported. Used by harness/firmware/u545re/run_rust.sh.
board-u545 = []
# Include the per-phase stack-attribution instrumentation (see main.rs).
# Off by default so the measured baseline image stays lean; scripts/fw_rust.sh
# --phases builds with this feature for the attribution run.
stack-phases = []
# Passthrough of the crate's size-oriented CRC32 (64-byte nibble table instead
# of the 1 KiB byte table, ~2x CRC CPU).  Used for the optional secondary
# measurement (`scripts/fw_rust.sh size --small-crc`); default stays untouched.
small-crc = ["flashdb/small-crc"]
# QEMU cycle/instruction proxy (NON-default, QEMU builds only).  Instrument the
# phase boundaries with ARM semihosting SYS_ELAPSED (0x30) / SYS_TICKFREQ (0x31)
# and run the board rollover workload, so the -z profile's TS/rollover cycle
# cost can be iterated without silicon: under `qemu-system-arm -icount shift=0`
# one virtual tick is one executed instruction, which makes the measurement
# deterministic and instruction-exact.  Off by default so the documented QEMU
# RESULT baseline stays byte-identical.
qemu-cycles = []
# On-silicon internal-flash endurance test: real page erase + quad-word
# program cycles with per-cycle verification (see flash_endurance.rs).
flash-endurance = ["board-u545"]
# On-silicon long-run test: real KVDB + TSDB on internal flash for ~60 s of
# operation, with per-round verification and remounts (see flash_longrun.rs).
flash-longrun = ["board-u545"]
# On-silicon real-flash C/Rust image parity: the crate writes the deterministic
# parity image on internal flash; the host compares it with the host model.
flash-parity = ["board-u545"]
# Real-flash power-loss injection: writer image stopped by an external reset
# while it is programming/erasing (no result is printed; the host resets it).
flash-fault-write = ["board-u545"]
# Verification image run after interrupted writes: mount/recover, verify the
# database and print the recovery result.
flash-fault-verify = ["board-u545"]
# Reboot soak: the firmware repeatedly resets itself between write rounds and
# verifies the persisted database state after each reboot.
flash-reboot-soak = ["board-u545"]

[dependencies]
# Real Rust rewrite under measurement (no_std, no external dependencies).
# NOTE: the firmware implements flashdb::Flash directly over the .sim_flash
# NOLOAD region (main.rs) instead of using flashdb-sim::RamFlash, because
# RamFlash owns its 16 KiB buffer by value -- in a bare-metal image that buffer
# would land in .data (16 KiB of ROM) and in the static-RAM metric.  The
# flashdb-sim crate remains the simulator for host benchmarks/tests.
flashdb = { path = "../../../crates/flashdb" }

# Size-oriented profile matching the C firmware's -Os (no LTO, one CGU).
# scripts/fw_rust.sh builds this profile by default; select the `size`
# profile for the smaller opt-level="z" + LTO variant.
[profile.release]
opt-level = "s"
# LTO is required for dead-code elimination here: stable rustc emits the whole
# crate in one .text section (no per-function sections), so without LTO the
# linker cannot drop unused code such as the not-yet-used TSDB module.
lto = true
codegen-units = 1
panic = "abort"
debug = false
overflow-checks = false
debug-assertions = false

[profile.size]
inherits = "release"
opt-level = "z"
lto = true
